<!DOCTYPE html>
<!-- Author: DiskoZawr - https://github.com/Diskoza -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="author" content="DiskoZawr - https://github.com/Diskoza">
  <title>Video Pop-Out Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
    }

    /* Toolbar */
    .toolbar {
      background: #111;
      display: flex;
      align-items: center;
      padding: 4px 8px;
      gap: 8px;
      flex-shrink: 0;
      height: 32px;
      border-bottom: 1px solid #222;
      -webkit-app-region: drag; /* Drag area */
      user-select: none;
    }
    .toolbar .yt-logo {
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }
    .toolbar .title {
      flex: 1;
      font-size: 11px;
      color: #ccc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .toolbar .controls {
      display: flex;
      gap: 4px;
      -webkit-app-region: no-drag;
    }
    .toolbar button {
      background: none;
      border: none;
      color: #999;
      cursor: pointer;
      padding: 3px 5px;
      border-radius: 3px;
      font-size: 12px;
      line-height: 1;
      transition: background 0.1s, color 0.1s;
    }
    .toolbar button:hover { background: #2a2a2a; color: #fff; }

    /* Player iframe */
    #player-frame {
      flex: 1;
      width: 100%;
      border: none;
      display: block;
    }

    /* Loading overlay */
    #loading {
      position: absolute;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 10;
    }
    #loading .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #333;
      border-top-color: #ff0000;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    #loading p { color: #aaa; font-size: 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="toolbar">
    <!-- YouTube logo -->
    <svg class="yt-logo" width="40" height="16" viewBox="0 0 40 16" fill="none">
      <rect width="40" height="16" rx="3" fill="#FF0000"/>
      <path d="M15 4.5V11.5L21.5 8L15 4.5Z" fill="white"/>
      <text x="24" y="12" font-family="Arial" font-size="9" font-weight="bold" fill="white">YT</text>
    </svg>

    <span class="title" id="videoTitle">Video Pop-Out Player</span>

    <div class="controls">
      <!-- Picture-in-Picture -->
      <button id="pipBtn" title="Picture in Picture">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 11h-8v6h8v-6zm4 8V4.98C23 3.88 22.1 3 21 3H3C1.9 3 1 3.88 1 4.98V19c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2zm-2 .02H3V4.97h18v14.05z"/>
        </svg>
      </button>
      <!-- Open on YouTube -->
      <button id="openBtn" title="Open on YouTube">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 19H5V5h7V3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Loading overlay -->
  <div id="loading">
    <div class="spinner"></div>
    <p>Loading video...</p>
  </div>

  <!-- Main player -->
  <iframe
    id="player-frame"
    allowfullscreen
    allow="autoplay; encrypted-media; picture-in-picture; web-share"
  ></iframe>

  <script src="popout.js"></script>
</body>
</html>
