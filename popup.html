<!DOCTYPE html>
<!-- Author: DiskoZawr - https://github.com/Diskoza -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="author" content="DiskoZawr - https://github.com/Diskoza">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Pop-Out Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 280px;
      background: #0f0f0f;
      color: #fff;
      font-family: Roboto, Arial, sans-serif;
      overflow: hidden;
    }

    .header {
      background: #111;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #222;
    }

    .header svg { flex-shrink: 0; }

    .header h1 {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      line-height: 1.3;
    }

    .header span {
      font-size: 11px;
      color: #aaa;
    }

    .preview {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      overflow: hidden;
    }

    .preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .preview .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .preview .play-icon {
      width: 56px;
      height: 56px;
      background: rgba(255,0,0,0.9);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-info {
      padding: 12px 16px 10px;
    }

    .video-title {
      font-size: 13px;
      font-weight: 500;
      color: #fff;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.4;
      margin-bottom: 4px;
    }

    .video-channel {
      font-size: 11px;
      color: #aaa;
    }

    .btn-wrap { padding: 0 16px 14px; }

    .btn {
      width: 100%;
      min-height: 40px;
      padding: 10px 12px;
      background: #ff0000;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s;
    }

    .btn:hover { background: #cc0000; }
    .btn:active { background: #aa0000; }
    .btn:disabled { background: #444; cursor: not-allowed; }

    .status {
      padding: 0 16px 14px;
      font-size: 11px;
      color: #777;
      text-align: center;
      line-height: 1.5;
    }

    .no-video {
      padding: 24px 16px;
      text-align: center;
    }

    .no-video .icon {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0;
      margin-bottom: 10px;
      color: #fff;
    }

    .no-video p {
      font-size: 12px;
      color: #aaa;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="header">
    <svg width="24" height="17" viewBox="0 0 24 17" fill="none" aria-hidden="true">
      <rect width="24" height="17" rx="4" fill="#FF0000"/>
      <path d="M9.5 4.5V12.5L16.5 8.5L9.5 4.5Z" fill="white"/>
    </svg>
    <div>
      <h1>Pop-Out Player</h1>
      <span>Video Mini Window</span>
    </div>
  </div>

  <div id="videoSection" style="display:none">
    <div class="preview" id="previewArea">
      <img id="thumbImg" src="" alt="Video thumbnail">
      <div class="overlay">
        <div class="play-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="white" aria-hidden="true">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </div>
      </div>
    </div>
    <div class="video-info">
      <div class="video-title" id="videoTitle">Loading...</div>
      <div class="video-channel" id="videoChannel"></div>
    </div>
    <div class="btn-wrap">
      <button class="btn" id="popoutBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="white" aria-hidden="true">
          <path d="M19 11h-8v6h8v-6zm4 8V5c0-1.1-.9-2-2-2H3C1.9 3 1 3.9 1 5v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2zM3 19V5h18v14H3z"/>
        </svg>
        Start Picture-in-Picture
      </button>
    </div>
    <div class="status" id="statusText"></div>
  </div>

  <div id="noVideoSection" style="display:none">
    <div class="no-video">
      <div class="icon">VIDEO</div>
      <p>Open a page with a video,<br>then start Picture-in-Picture.</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
